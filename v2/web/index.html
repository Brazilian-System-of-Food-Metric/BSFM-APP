<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BSFM — acompanhe calorias, água e evolução nutricional." />

    <!-- PWA: instalável no celular e no desktop -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1411" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS: sem suporte a manifest em versões antigas, mas estes metas funcionam -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BSFM" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <title>BSFM · Nutrição</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Libras: widget oficial do governo, mesmo recurso da versão anterior. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
    <script defer>
      window.addEventListener('load', () => {
        if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app')
      })
    </script>
  </body>
</html>
